# GitHub Pages build config.
# Everything listed here stays in the repo but is left out of the published site.
exclude:
  - templates/        # abandoned design directions, kept for reference only
  - package.json      # sharp, used offline to convert screenshots to WebP
  - package-lock.json
  - README.md
  - assets/ada.png    # PNG sources; the site serves the .webp versions
  - assets/briefly.png
  - assets/collabcode.png
  - assets/docent.png
